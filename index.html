<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winter Global Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDf4wP-Q6k7l5s7x3UrT8FDwQLBcY38SEI",
            authDomain: "clicker-d12d4.firebaseapp.com",
            databaseURL: "https://clicker-d12d4-default-rtdb.firebaseio.com",
            projectId: "clicker-d12d4",
            storageBucket: "clicker-d12d4.firebasestorage.app",
            messagingSenderId: "354447424921",
            appId: "1:354447424921:web:1fe5dce83dd9f10c4d6708",
            measurementId: "G-LKMHBMFGN6"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.log("Ошибка Firebase:", e);
        }

        window.gameDB = { db, ref, onValue, set, runTransaction };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        :root {
            --primary: #5bc0de;
            --dark: #1e3c72;
            --light: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- СНЕГ --- */
        #snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        /* --- ЗАГРУЗКА --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text {
            font-size: 24px;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* --- МЕНЮ (ГАМБУРГЕР) --- */
        #menu-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 45px; height: 45px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        #menu-btn:active { transform: scale(0.9); }
        #menu-btn div {
            width: 25px; height: 3px;
            background: white;
            border-radius: 2px;
            transition: 0.3s;
        }

        /* --- БОКОВОЕ МЕНЮ --- */
        #sidebar {
            position: absolute;
            top: 0; left: -300px;
            width: 280px; height: 100%;
            background: rgba(15, 32, 39, 0.9);
            backdrop-filter: blur(20px);
            z-index: 99;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 80px 20px 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }
        .menu-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .menu-item:hover, .menu-item.active {
            background: rgba(91, 192, 222, 0.2);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        /* --- ЭКРАНЫ --- */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .screen.active {
            opacity: 1;
            pointer-events: all;
        }

        /* --- КЛИКЕР --- */
        #clicker-screen {
            justify-content: center;
        }
        .hp-bar-container {
            position: absolute;
            top: 25px;
            width: 80%;
            max-width: 400px;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        .hp-bar {
            height: 30px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            width: 100%;
            transition: width 0.1s linear;
        }
        .hp-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 900;
            text-shadow: 1px 1px 2px black;
        }

        .character-container {
            width: 80vw;
            max-width: 400px;
            height: 60vh;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s;
        }
        .character-container:active {
            transform: scale(0.95);
        }
        .character-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Урон */
        .damage-text {
            position: absolute;
            color: white;
            font-weight: 900;
            font-size: 24px;
            text-shadow: 0 0 10px red, 2px 2px 0 black;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }
        
        .dead-message {
            position: absolute;
            font-size: 20px;
            font-weight: 900;
            color: #ff4b2b;
            text-shadow: 0 0 10px black;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
            animation: pop 0.3s ease-out;
        }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }

        /* --- ПРОФИЛЬ --- */
        .profile-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: #203a43;
            border: 3px solid var(--primary);
            margin-bottom: 15px;
            display: flex; justify-content: center; align-items: center;
            font-size: 40px;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .username { font-size: 24px; margin-bottom: 30px; font-weight: 900;}
        
        .castle-btn {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .castle-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* --- АДМИН ПАНЕЛЬ --- */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 25px;
            border-radius: 20px;
            width: 90%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: 0.3s;
        }
        .modal-overlay.active .modal { transform: scale(1); }

        .modal h2 { margin-bottom: 20px; text-align: center; }
        .modal input {
            width: 100%; padding: 12px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white; font-size: 16px; outline: none;
        }
        .modal input:focus { border-color: var(--primary); }
        .modal button {
            width: 100%; padding: 12px;
            background: var(--primary);
            border: none; border-radius: 10px;
            color: white; font-size: 18px; font-weight: 900;
            cursor: pointer; margin-bottom: 10px;
        }
        .modal button:active { transform: scale(0.95); }
        .close-btn { background: rgba(255,255,255,0.1) !important; }

        .admin-images {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px;
        }
        .admin-images img {
            width: 100%; height: 60px; object-fit: contain;
            background: rgba(0,0,0,0.3); border-radius: 8px;
            border: 2px solid transparent; cursor: pointer;
        }
        .admin-images img.selected { border-color: var(--primary); background: rgba(91, 192, 222, 0.2); }
    </style>
</head>
<body>

    <div id="snow-container"></div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Загрузка...</div>
    </div>

    <div id="menu-btn">
        <div></div><div></div><div></div>
    </div>

    <div id="sidebar">
        <div class="menu-item active" onclick="switchScreen('clicker')">Кликер</div>
        <div class="menu-item" onclick="switchScreen('profile')">Профиль</div>
    </div>

    <div id="clicker-screen" class="screen active">
        <div class="hp-bar-container">
            <div class="hp-bar" id="hp-bar-fill"></div>
            <div class="hp-text" id="hp-text">0 / 1000000</div>
        </div>
        <div class="character-container" id="char-container">
            <img id="main-character" src="1.png" alt="Character">
        </div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="username" id="user-name">Игрок</div>
            
            <button class="castle-btn" onclick="openAdminPassword()">
                Замок Админа
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="password-modal">
        <div class="modal">
            <h2>Вход в Замок</h2>
            <input type="password" id="admin-pass" placeholder="Введите пароль...">
            <button onclick="checkPassword()">Войти</button>
            <button class="close-btn" onclick="closeModal('password-modal')">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="admin-modal">
        <div class="modal">
            <h2>Админ Панель</h2>
            
            <label style="font-size:14px; margin-bottom:5px; display:block;">Выберите персонажа:</label>
            <div class="admin-images" id="admin-images-list">
                <img src="1.png" onclick="selectAdminImage(this, '1.png')" class="selected">
                <img src="2.png" onclick="selectAdminImage(this, '2.png')">
                <img src="3.png" onclick="selectAdminImage(this, '3.png')">
                <img src="4.png" onclick="selectAdminImage(this, '4.png')">
                <img src="5.png" onclick="selectAdminImage(this, '5.png')">
            </div>

            <label style="font-size:14px; margin-bottom:5px; display:block;">Введите максимальное HP:</label>
            <input type="number" id="admin-hp" placeholder="Например: 1000000" value="1000000">
            
            <button onclick="applyAdminSettings()" style="margin-top: 10px;">Применить и Обновить</button>
            <button class="close-btn" onclick="closeModal('admin-modal')">Закрыть</button>
        </div>
    </div>

    <script>
        // --- ЗВУКИ ---
        function playSound(file) {
            new Audio(file).play().catch(e => console.log("Audio play error:", e));
        }

        // Обработчик звука для всех кнопок КРОМЕ персонажа
        document.addEventListener('pointerdown', (e) => {
            // Если клик по персонажу, ничего не делаем (это обрабатывается ниже)
            if (e.target.closest('#char-container')) return;
            
            // Если клик по любой кнопке, пункту меню или картинке в админке
            if (e.target.closest('button') || e.target.closest('.menu-item') || e.target.closest('#menu-btn') || e.target.closest('.admin-images img')) {
                playSound('2.ogg');
            }
        });

        // Генерация снега
        const snowContainer = document.getElementById('snow-container');
        for (let i = 0; i < 50; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            const size = Math.random() * 5 + 2 + 'px';
            snowflake.style.width = size;
            snowflake.style.height = size;
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowContainer.appendChild(snowflake);
        }

        // Загрузка (2 секунды)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }, 2000);
        });

        // Меню
        const menuBtn = document.getElementById('menu-btn');
        const sidebar = document.getElementById('sidebar');
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        function switchScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            
            document.getElementById(screenName + '-screen').classList.add('active');
            event.target.classList.add('active');
            sidebar.classList.remove('open');
        }

        // Telegram Данные
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
                if (user.photo_url) {
                    document.getElementById('user-avatar').innerHTML = `<img src="${user.photo_url}">`;
                }
            }
        }

        // ЛОГИКА
        let currentImageName = '1.png';
        let maxHP = 1000000;
        let currentHP = 1000000;
        let isDead = false;

        const hpBarFill = document.getElementById('hp-bar-fill');
        const hpText = document.getElementById('hp-text');
        const charContainer = document.getElementById('char-container');
        const mainCharacter = document.getElementById('main-character');

        function updateUI() {
            const percent = Math.max(0, (currentHP / maxHP) * 100);
            hpBarFill.style.width = percent + '%';
            
            const formatNum = (num) => Math.floor(num).toLocaleString('ru-RU');
            hpText.innerText = `${formatNum(currentHP)} / ${formatNum(maxHP)}`;

            if (currentHP <= 0) {
                isDead = true;
                mainCharacter.style.filter = 'grayscale(100%) opacity(0.5)';
            } else {
                isDead = false;
                mainCharacter.style.filter = 'drop-shadow(0 15px 25px rgba(0,0,0,0.6))';
            }
        }

        charContainer.addEventListener('pointerdown', (e) => {
            if (!isDead) {
                playSound('1.ogg'); // Звук при ударе по живому персонажу

                let damage = 1;
                let roll = Math.random() * 100;
                if (roll < 80) damage = 1;
                else if (roll < 95) damage = 5;
                else if (roll < 99.99) damage = 50;
                else damage = 1000;

                if (currentHP - damage < 0) damage = currentHP;

                currentHP -= damage;
                
                showDamageText(e.clientX, e.clientY, damage);
                updateUI();
                saveClickToDatabase(damage);
            } else {
                playSound('3.ogg'); // Звук, когда персонаж уже мёртв
                showDeadMessage(e.clientX, e.clientY);
            }
        });

        function showDamageText(x, y, dmg) {
            const el = document.createElement('div');
            el.className = 'damage-text';
            el.innerText = '-' + dmg;
            el.style.left = (x - 20) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function showDeadMessage(x, y) {
            const el = document.createElement('div');
            el.className = 'dead-message';
            el.innerText = 'Уже мертв!';
            el.style.left = (x - 40) + 'px';
            el.style.top = (y - 20) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        // БАЗА ДАННЫХ
        function initDatabase() {
            const { db, ref, onValue, set } = window.gameDB;

            if (db) {
                onValue(ref(db, 'game/'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        if (data.maxHP !== undefined) maxHP = data.maxHP;
                        if (data.currentHP !== undefined) currentHP = data.currentHP;
                        if (data.image && data.image !== currentImageName) {
                            currentImageName = data.image;
                            mainCharacter.src = currentImageName;
                        }
                        updateUI();
                    } else {
                        set(ref(db, 'game/'), {
                            maxHP: 1000000,
                            currentHP: 1000000,
                            image: '1.png'
                        });
                    }
                });
            } else {
                updateUI();
            }
        }

        function saveClickToDatabase(dmg) {
            const { db, ref, runTransaction } = window.gameDB;
            if (db) {
                runTransaction(ref(db, 'game/currentHP'), (hp) => {
                    if (hp === null) return maxHP - dmg;
                    return Math.max(0, hp - dmg);
                });
            }
        }

        setTimeout(initDatabase, 1000);

        // АДМИНКА
        function openAdminPassword() {
            document.getElementById('password-modal').classList.add('active');
            document.getElementById('admin-pass').value = '';
        }

        function checkPassword() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'Самир2014') {
                closeModal('password-modal');
                document.getElementById('admin-modal').classList.add('active');
                document.getElementById('admin-hp').value = maxHP;
            } else {
                if (tg) tg.showAlert("Неверный пароль!");
                else alert("Неверный пароль!");
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        let selectedImageName = '1.png';
        function selectAdminImage(imgElement, name) {
            document.querySelectorAll('#admin-images-list img').forEach(i => i.classList.remove('selected'));
            imgElement.classList.add('selected');
            selectedImageName = name;
        }

        function applyAdminSettings() {
            const newHP = parseInt(document.getElementById('admin-hp').value);
            if (!newHP || newHP <= 0) {
                if (tg) tg.showAlert("Введите корректное число HP!");
                else alert("Введите корректное число HP!");
                return;
            }

            const { db, ref, set } = window.gameDB;

            if (db) {
                set(ref(db, 'game/'), {
                    maxHP: newHP,
                    currentHP: newHP,
                    image: selectedImageName
                });
                if (tg) tg.showAlert("Глобальные настройки применены!");
                else alert("Глобальные настройки применены!");
            } else {
                maxHP = newHP;
                currentHP = newHP;
                currentImageName = selectedImageName;
                mainCharacter.src = currentImageName;
                updateUI();
            }
            closeModal('admin-modal');
        }
    </script>
</body>
</html>
